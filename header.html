
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncSound Animated Header</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: "Outfit", sans-serif;
  background: #ffffff;
  color: #625968;
}

/* HEADER */
.header {
  width: 100%;
  min-height: 112px;
  padding: 20px 24px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;

  background: rgba(252, 245, 240, 0.94);
  border: 1px solid #ffffff;
  border-radius: 26px;

  box-shadow:
    0 4px 20px rgba(130, 100, 120, 0.05),
    inset 0 0 0 1px rgba(224, 199, 211, 0.16);
}

/* LEFT SECTION */
.header-left {
  display: flex;
  align-items: center;
  gap: 22px;
}

.menu-button,
.icon-button,
.avatar {
  width: 58px;
  height: 58px;
  flex-shrink: 0;

  display: grid;
  place-items: center;

  background: rgba(255, 255, 255, 0.85);
  border: 1px solid #ffffff;
  border-radius: 50%;

  box-shadow: 0 3px 12px rgba(120, 90, 110, 0.07);
  color: #514758;

  cursor: pointer;
  transition: transform 0.2s ease;
}

.menu-button:hover,
.icon-button:hover,
.avatar:hover {
  transform: translateY(-2px);
}

.menu-button svg,
.icon-button svg {
  width: 22px;
  height: 22px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ANIMATED LOGO */
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;

  text-decoration: none;
  white-space: nowrap;
}

/* Waveform */
.brand-wave {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  overflow: visible;
}

.wave-bar {
  transform-box: fill-box;
  transform-origin: center;

  animation: soundWave 1.1s ease-in-out infinite;
}

.wave-bar:nth-child(1) { animation-delay: -0.2s; }
.wave-bar:nth-child(2) { animation-delay: -0.5s; }
.wave-bar:nth-child(3) { animation-delay: -0.1s; }
.wave-bar:nth-child(4) { animation-delay: -0.7s; }
.wave-bar:nth-child(5) { animation-delay: -0.3s; }
.wave-bar:nth-child(6) { animation-delay: -0.6s; }

@keyframes soundWave {
  0%, 100% {
    transform: scaleY(0.35);
  }

  50% {
    transform: scaleY(1);
  }
}

/* Wordmark */
.brand-name {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -1.4px;
  line-height: 1;
}

.brand-name .sync {
  color: #755568;
}

.brand-name .sound {
  background: linear-gradient(
    110deg,
    #e59ab8 0%,
    #c1a5d9 35%,
    #8f8dc8 60%,
    #e59ab8 100%
  );

  background-size: 200% 100%;

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  animation: logoShimmer 6s ease-in-out infinite;
}

@keyframes logoShimmer {
  0%, 100% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }
}

/* CENTER NAVIGATION */
.navigation {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;

  padding: 22px 30px;

  background: rgba(255, 255, 255, 0.56);
  border: 1px solid #ffffff;
  border-radius: 26px;
}

.nav-item {
  display: inline-flex;
  align-items: center;
  gap: 10px;

  color: #6b606e;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;

  transition: color 0.2s ease;
}

.nav-item:hover {
  color: #b785c3;
}

.nav-item svg {
  width: 22px;
  height: 22px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* RIGHT SECTION */
.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.avatar {
  background: #b8acde;
  border: 2px solid #ffffff;

  color: #393145;
  font-size: 16px;
  font-weight: 600;
}

/* RESPONSIVE */
@media (max-width: 1000px) {
  .header {
    padding: 16px;
    gap: 12px;
  }

  .header-left {
    gap: 12px;
  }

  .brand-name {
    font-size: 25px;
  }

  .brand-wave {
    width: 36px;
    height: 36px;
  }

  .navigation {
    gap: 18px;
    padding: 18px;
  }

  .header-right {
    gap: 10px;
  }

  .menu-button,
  .icon-button,
  .avatar {
    width: 48px;
    height: 48px;
  }
}

@media (max-width: 700px) {
  .header {
    flex-wrap: wrap;
  }

  .brand-name {
    font-size: 22px;
  }

  .brand-wave {
    width: 32px;
    height: 32px;
  }

  .navigation {
    order: 3;
    width: 100%;
  }

  .header-right {
    margin-left: auto;
  }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
  .wave-bar,
  .brand-name .sound {
    animation: none;
  }

  .menu-button,
  .icon-button,
  .avatar {
    transition: none;
  }
}
</style>
</head>

<body>

<header class="header">

  <!-- LEFT: MENU AND ANIMATED LOGO -->
  <div class="header-left">

    <button class="menu-button" aria-label="Open menu">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

    <a href="#" class="brand" aria-label="SyncSound Home">

      <!-- Animated audio waveform -->
      <svg
        class="brand-wave"
        viewBox="0 0 48 48"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="waveGradient"
            x1="0" y1="0" x2="48" y2="48">
            <stop offset="0%" stop-color="#E59AB8"/>
            <stop offset="55%" stop-color="#C1A5D9"/>
            <stop offset="100%" stop-color="#8F8DC8"/>
          </linearGradient>
        </defs>

        <g fill="url(#waveGradient)">
          <rect class="wave-bar" x="3"  y="20" width="4" height="8" rx="2"/>
          <rect class="wave-bar" x="10" y="13" width="4" height="22" rx="2"/>
          <rect class="wave-bar" x="17" y="7" width="4" height="34" rx="2"/>
          <rect class="wave-bar" x="24" y="15" width="4" height="18" rx="2"/>
          <rect class="wave-bar" x="31" y="10" width="4" height="28" rx="2"/>
          <rect class="wave-bar" x="38" y="19" width="4" height="10" rx="2"/>
        </g>
      </svg>

      <!-- Gradient wordmark -->
      <span class="brand-name">
        <span class="sync">Sync</span><span class="sound">Sound</span>
      </span>

    </a>
  </div>

  <!-- CENTER: NAVIGATION -->
  <nav class="navigation" aria-label="Main navigation">

    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>
      </svg>
      <span>Home</span>
    </a>

    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="M4 4h6a4 4 0 0 1 4 4v13a4 4 0 0 0-4-4H4z"/>
        <path d="M20 4h-6a4 4 0 0 0-4 4v13a4 4 0 0 1 4-4h6z"/>
      </svg>
      <span>Your Library</span>
    </a>

  </nav>

  <!-- RIGHT: NOTIFICATIONS AND PROFILE -->
  <div class="header-right">

    <button class="icon-button" aria-label="Notifications">
      <svg viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>
      </svg>
    </button>

    <button class="avatar" aria-label="Profile">H</button>

  </div>

</header>

</body>
</html>
